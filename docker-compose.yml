name: argus

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-crosschecklab}
      POSTGRES_USER: ${DB_USERNAME:-crosschecklab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-crosschecklab}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - data

  ai-service:
    build:
      context: ./ai-service
    restart: unless-stopped
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_SERVICE_INTERNAL_TOKEN: ${AI_SERVICE_INTERNAL_TOKEN:-crosschecklab-local-internal-token}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-32768}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-}
    mem_limit: ${AI_SERVICE_MEM_LIMIT:-512m}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${AI_SERVICE_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/internal/v1/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - data

  ocr-worker:
    build:
      context: ./ocr-worker
    restart: unless-stopped
    init: true
    user: ocr
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    environment:
      OCR_WORKER_TOKEN: ${OCR_WORKER_TOKEN:-crosschecklab-local-ocr-token}
      OCR_TIMEOUT_SECONDS: ${OCR_WORKER_TIMEOUT_SECONDS:-30}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; connection = socket.create_connection(('127.0.0.1', 8080), 2); connection.close()"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: 1.0
    mem_limit: 768m
    networks:
      - ocr

  storage-init:
    image: argus-backend:local
    restart: "no"
    user: root
    entrypoint: ["chown", "argus:argus", "/var/lib/argus/documents"]
    volumes:
      - document-data:/var/lib/argus/documents

  backend:
    image: argus-backend:local
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-crosschecklab}
      DB_USERNAME: ${DB_USERNAME:-crosschecklab}
      DB_PASSWORD: ${DB_PASSWORD:-crosschecklab}
      DB_SSLMODE: disable
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_ALLOW_INSECURE_HTTP: "true"
      AI_SERVICE_INTERNAL_TOKEN: ${AI_SERVICE_INTERNAL_TOKEN:-crosschecklab-local-internal-token}
      AI_SERVICE_READ_TIMEOUT: ${AI_SERVICE_READ_TIMEOUT:-180s}
      OCR_WORKER_URL: http://ocr-worker:8080
      OCR_WORKER_ALLOW_INSECURE_HTTP: "true"
      OCR_WORKER_TOKEN: ${OCR_WORKER_TOKEN:-crosschecklab-local-ocr-token}
      OCR_WORKER_CONNECT_TIMEOUT: ${OCR_WORKER_CONNECT_TIMEOUT:-2s}
      OCR_WORKER_REQUEST_TIMEOUT: ${OCR_WORKER_REQUEST_TIMEOUT:-45s}
      SPRING_PROFILES_ACTIVE: real-extraction
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 1024MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 1024MB
      SERVER_TOMCAT_MAX_HTTP_FORM_POST_SIZE: 1024MB
      SERVER_TOMCAT_MAX_SWALLOW_SIZE: 1024MB
      SERVER_TOMCAT_MAX_PART_COUNT: "100"
      DOCUMENT_BATCH_WORKER_INITIAL_DELAY: ${DOCUMENT_BATCH_WORKER_INITIAL_DELAY:-PT2S}
      DOCUMENT_BATCH_WORKER_FIXED_DELAY: ${DOCUMENT_BATCH_WORKER_FIXED_DELAY:-PT5S}
      RAG_OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      RAG_OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-bge-m3:latest}
      # 컨테이너 메모리 상한 안에서 heap을 잡고, OOM이면 프로세스를 끝내 restart와 batch lease/fence 회수에 맡긴다.
      JAVA_TOOL_OPTIONS: ${BACKEND_JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=60.0 -XX:+ExitOnOutOfMemoryError}
    mem_limit: ${BACKEND_MEM_LIMIT:-2g}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - document-data:/var/lib/argus/documents
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      ocr-worker:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - app
      - data
      - ocr

  frontend:
    build:
      context: ./frontend
      args:
        VITE_USE_MOCK: "false"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app

volumes:
  postgres-data:
  document-data:

networks:
  app:
  data:
  ocr:
    internal: true
