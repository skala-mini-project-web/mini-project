name: argus

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-crosschecklab}
      POSTGRES_USER: ${DB_USERNAME:-crosschecklab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-crosschecklab}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - data

  ai-service:
    build:
      context: ./ai-service
    ports:
      - "127.0.0.1:${AI_SERVICE_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/internal/v1/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - data

  backend:
    build:
      context: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-crosschecklab}
      DB_USERNAME: ${DB_USERNAME:-crosschecklab}
      DB_PASSWORD: ${DB_PASSWORD:-crosschecklab}
      DB_SSLMODE: disable
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_ALLOW_INSECURE_HTTP: "true"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - app
      - data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_USE_MOCK: "false"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app

volumes:
  postgres-data:

networks:
  app:
  data:
