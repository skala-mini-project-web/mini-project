spring:
  application:
    name: crosschecklab

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:crosschecklab}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway가 관리, JPA는 검증만
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# 외부 ai-service(FastAPI Mock) 호출 설정. Provider 교체 시 여기만 바꾼다.
ai-service:
  base-url: ${AI_SERVICE_URL:http://localhost:8000}
  connect-timeout: 2s
  read-timeout: 20s
  # X-Demo-Scenario 헤더가 없을 때 사용할 기본 Fixture 시나리오
  default-scenario-code: GUARANTEE_MISUNDERSTANDING_HIGH

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug

  # 로그 라인마다 traceId 를 찍어서 요청 단위로 추적
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-no-trace}] %logger{36} - %msg%n"
